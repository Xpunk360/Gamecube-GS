<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GameCube SD Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- INTRO -->
<div id="intro">
    <img src="assets/images/gamecube_logo.png" class="logo">
    <audio id="gc-audio" src="assets/audio/gamecube_intro.mp3"></audio>
</div>

<!-- SELECCIÓN DE MEMORIA -->
<div id="memory-select" class="hidden">
    <button onclick="selectMemory(30)">Micro SD 30GB</button>
    <button onclick="selectMemory(62)">Micro SD 62GB</button>
</div>

<!-- LISTA DE JUEGOS -->
<div id="games-screen" class="hidden">

    <div id="storage-bar">
        <p id="storage-text">Espacio disponible: 0 GB</p>
    </div>

    <div id="games-list"></div>

    <button id="send-btn" onclick="openConfirm()">Enviar lista</button>
</div>

<!-- MODAL CONFIRMACIÓN -->
<div id="confirm-modal" class="modal hidden">
    <div class="modal-box">
        <p>¿Estás seguro con tu lista?</p>
        <div class="modal-buttons">
            <button onclick="confirmYes()">Sí</button>
            <button onclick="confirmNo()">No</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
